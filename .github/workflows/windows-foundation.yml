name: Windows foundation

on:
  push:
    branches:
      - windows/platform-foundation-20260821
  pull_request:
    paths:
      - 'lact-client/**'
      - 'lact-schema/**'
      - 'lact-daemon/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-foundation.yml'

concurrency:
  group: windows-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: Check schema and client
        run: cargo check -p lact-schema -p lact-client

  daemon-probe:
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: Probe daemon compilation
        run: cargo check -p lact-daemon --no-default-features
