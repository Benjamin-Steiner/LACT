name: Windows foundation

on:
  push:
    branches:
      - windows/platform-foundation-20260821
  pull_request:
    paths:
      - 'lact/**'
      - 'lact-cli/**'
      - 'lact-client/**'
      - 'lact-schema/**'
      - 'lact-daemon/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows-foundation.yml'

concurrency:
  group: windows-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: Check schema and client
        run: cargo check -p lact-schema -p lact-client

  daemon-check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: Check Windows daemon
        run: cargo check -p lact-daemon --no-default-features

  executable-smoke-test:
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: Build Windows executable
        run: cargo build -p lact --no-default-features
      - name: Start daemon and query it with the CLI
        shell: pwsh
        run: |
          $daemon = Start-Process -FilePath .\target\debug\lact.exe -ArgumentList 'daemon' -PassThru
          try {
            Start-Sleep -Seconds 2
            & .\target\debug\lact.exe cli list-gpus
            if ($LASTEXITCODE -ne 0) {
              throw "LACT CLI smoke test failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lact-windows-foundation-debug
          path: target/debug/lact.exe
          if-no-files-found: error

  preview-release:
    if: github.event_name == 'pull_request'
    needs:
      - client-check
      - daemon-check
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97'
      - name: Build release executable
        run: cargo build --release -p lact --no-default-features
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item .\target\release\lact.exe .\dist\lact-windows-x86_64.exe
          $hash = (Get-FileHash .\dist\lact-windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lact-windows-x86_64.exe" | Set-Content -Encoding ascii .\dist\lact-windows-x86_64.exe.sha256.txt
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: lact-windows-x86_64-release
          path: |
            dist/lact-windows-x86_64.exe
            dist/lact-windows-x86_64.exe.sha256.txt
          if-no-files-found: error
      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-preview-${{ github.run_number }}"
          gh release create $tag `
            .\dist\lact-windows-x86_64.exe `
            .\dist\lact-windows-x86_64.exe.sha256.txt `
            --target "${{ github.event.pull_request.head.sha }}" `
            --title "LACT Windows Preview ${{ github.run_number }}" `
            --prerelease `
            --notes "Experimental Windows x86_64 build from branch windows/platform-foundation-20260821. NVIDIA/NVML Windows backend; GUI is not included yet. Run the daemon elevated and use the CLI from the same executable."
