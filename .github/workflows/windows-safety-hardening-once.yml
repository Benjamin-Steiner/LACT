name: Apply Windows safety hardening

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/windows-safety-hardening-once.yml'

permissions:
  contents: write

concurrency:
  group: windows-safety-hardening
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: windows/platform-foundation-20260821
          fetch-depth: 0

      - name: Apply safe mode, diagnostics and release messaging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected block not found: {label}")
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Daemon: hard fail closed for every Windows GPU write request.
          # ------------------------------------------------------------------
          path = Path('lact-daemon/src/windows.rs')
          text = path.read_text()

          text = replace_once(
              text,
              'const NVIDIA_ID_PREFIX: &str = "nvidia:";\n',
              '''const NVIDIA_ID_PREFIX: &str = "nvidia:";
const WINDOWS_GPU_WRITE_UNLOCK_ENV: &str = "LACT_WINDOWS_ENABLE_GPU_WRITES";
const WINDOWS_GPU_WRITE_UNLOCK_VALUE: &str = "I_UNDERSTAND_THIS_IS_EXPERIMENTAL";

fn windows_gpu_writes_enabled() -> bool {
    env::var(WINDOWS_GPU_WRITE_UNLOCK_ENV)
        .is_ok_and(|value| value == WINDOWS_GPU_WRITE_UNLOCK_VALUE)
}

fn is_windows_gpu_write_request(request: &Request<'_>) -> bool {
    matches!(
        request,
        Request::SetFanControl(_)
            | Request::ResetPmfw { .. }
            | Request::SetPowerCap { .. }
            | Request::SetPerformanceLevel { .. }
            | Request::SetClocksValue { .. }
            | Request::BatchSetClocksValue { .. }
            | Request::SetPowerProfileMode { .. }
            | Request::SetEnabledPowerStates { .. }
            | Request::SetProfile { .. }
            | Request::HoldProfile { .. }
            | Request::SetGpuConfig { .. }
            | Request::DetachGpu { .. }
            | Request::ReattachGpu { .. }
            | Request::EnableOverdrive
            | Request::DisableOverdrive
            | Request::ConfirmPendingConfig(_)
            | Request::RestConfig
    )
}

fn require_windows_gpu_writes_enabled(operation: &str) -> anyhow::Result<()> {
    if windows_gpu_writes_enabled() {
        info!(operation, "Experimental Windows GPU write explicitly unlocked");
        Ok(())
    } else {
        warn!(operation, "Blocked Windows GPU write while Safe Read-Only Mode is active");
        Err(anyhow!(
            "Windows Safe Read-Only Mode blocked {operation}. GPU writes are disabled in this preview until automatic rollback/confirmation protection has been validated."
        ))
    }
}
''',
              'Windows write guard constants',
          )

          text = replace_once(
              text,
              '''        let response = match serde_json::from_str::<Request<'_>>(&buf) {
            Ok(Request::Ping) => ok_response(Pong)?,
''',
              '''        let response = match serde_json::from_str::<Request<'_>>(&buf) {
            Ok(request)
                if is_windows_gpu_write_request(&request) && !windows_gpu_writes_enabled() =>
            {
                warn!(request = ?request, "Blocked Windows GPU write request in Safe Read-Only Mode");
                serde_json::to_vec(&Response::<()>::from(anyhow!(
                    "Windows Safe Read-Only Mode is active. This preview will not change GPU clocks, voltage, fan, power limit, profiles, or driver state."
                )))?
            }
            Ok(Request::Ping) => ok_response(Pong)?,
''',
              'request-level write guard',
          )

          text = replace_once(
              text,
              '''fn batch_set_clocks_value(id: &str, commands: &[SetClocksCommand]) -> anyhow::Result<u64> {
    let nvml = init_nvml()?;
''',
              '''fn batch_set_clocks_value(id: &str, commands: &[SetClocksCommand]) -> anyhow::Result<u64> {
    require_windows_gpu_writes_enabled("clock/voltage tuning")?;
    let nvml = init_nvml()?;
''',
              'clock write defense in depth',
          )

          text = replace_once(
              text,
              '''fn set_power_cap(id: &str, cap: Option<f64>) -> anyhow::Result<u64> {
    let nvml = init_nvml()?;
''',
              '''fn set_power_cap(id: &str, cap: Option<f64>) -> anyhow::Result<u64> {
    require_windows_gpu_writes_enabled("power-limit change")?;
    let nvml = init_nvml()?;
''',
              'power write defense in depth',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Windows GUI: visibly read-only, no tuning button can dispatch writes.
          # ------------------------------------------------------------------
          path = Path('lact-gui/src/windows_app.rs')
          text = path.read_text()

          text = replace_once(
              text,
              'use adw::prelude::*;\n',
              'use crate::windows_log_dir;\nuse adw::prelude::*;\n',
              'Windows log helper import',
          )
          text = replace_once(
              text,
              '''use std::{
    os::windows::process::CommandExt as _,
    process::Command,
    time::Duration,
};
''',
              '''use std::{
    fs::OpenOptions,
    os::windows::process::CommandExt as _,
    process::{Command, Stdio},
    time::Duration,
};
''',
              'backend log imports',
          )
          text = replace_once(
              text,
              'const REFRESH_INTERVAL: Duration = Duration::from_secs(1);\n',
              '''const REFRESH_INTERVAL: Duration = Duration::from_secs(1);
const WINDOWS_SAFE_MODE: bool = true;
''',
              'safe-mode constant',
          )

          text = text.replace('set_sensitive: model.connected && ', 'set_sensitive: model.connected && !WINDOWS_SAFE_MODE && ')
          text = text.replace('set_sensitive: model.connected,', 'set_sensitive: model.connected && !WINDOWS_SAFE_MODE,')

          text = replace_once(
              text,
              '''                                add = &adw::PreferencesGroup {
                                    set_title: "Live telemetry",
''',
              '''                                add = &adw::PreferencesGroup {
                                    set_title: "Safety",
                                    set_description: Some("This build is intentionally fail-closed while Windows write/revert protection is being validated."),

                                    adw::ActionRow {
                                        set_title: "Windows Safe Read-Only Mode",
                                        set_subtitle: "ACTIVE - telemetry and driver ranges are readable, but LACT will not change clocks, voltage, fan, power limit, profiles, or driver state.",
                                        add_prefix = &gtk::Image {
                                            set_icon_name: Some("security-high-symbolic"),
                                        },
                                    },

                                    adw::ActionRow {
                                        set_title: "Diagnostic logs",
                                        set_subtitle: "%LOCALAPPDATA%\\LACT\\logs\\bootstrap.log, gui.log and daemon.log",
                                    },
                                },

                                add = &adw::PreferencesGroup {
                                    set_title: "Live telemetry",
''',
              'safety status group',
          )

          text = text.replace(
              '.title("LACT - Windows NVIDIA Tuning")',
              '.title("LACT - Windows NVIDIA Safe Preview")',
          )
          text = text.replace(
              'set_subtitle: "Windows / NVIDIA tuning preview",',
              'set_subtitle: "Windows / NVIDIA safe read-only preview",',
          )
          text = text.replace(
              'set_title: "Clock tuning",',
              'set_title: "Clock tuning (locked in Safe Mode)",',
          )
          text = text.replace(
              'set_title: "Power limit",',
              'set_title: "Power limit (locked in Safe Mode)",',
          )

          text = replace_once(
              text,
              '''            WindowsAppMsg::VoltageBoostDraft(value) => self.voltage_boost_input = value,
            WindowsAppMsg::ApplyPower => self.apply_power().await,
''',
              '''            WindowsAppMsg::VoltageBoostDraft(value) => self.voltage_boost_input = value,
            WindowsAppMsg::ApplyPower
            | WindowsAppMsg::ResetPower
            | WindowsAppMsg::ApplyClocks
            | WindowsAppMsg::ResetClocks
                if WINDOWS_SAFE_MODE =>
            {
                self.status = "Windows Safe Read-Only Mode blocked the GPU write".to_owned();
            }
            WindowsAppMsg::ApplyPower => self.apply_power().await,
''',
              'UI write dispatch guard',
          )

          text = replace_once(
              text,
              '''        self.status = if self.vf_points.is_empty() {
            "Connected - NVML tuning active".to_owned()
        } else {
            format!(
                "Connected - NVAPI V/F tuning active ({} editable points)",
                self.vf_points.len()
            )
        };
''',
              '''        self.status = "Connected - Windows Safe Read-Only Mode; live telemetry active".to_owned();
''',
              'safe connected status',
          )

          text = replace_once(
              text,
              '''    Command::new(&backend_exe)
        .arg("daemon")
        .creation_flags(CREATE_NO_WINDOW)
        .spawn()
        .with_context(|| format!("Could not launch {} daemon", backend_exe.display()))?;
''',
              '''    let mut command = Command::new(&backend_exe);
    command.arg("daemon").creation_flags(CREATE_NO_WINDOW);

    if let Ok(log_dir) = windows_log_dir()
        && let Ok(stdout) = OpenOptions::new()
            .create(true)
            .append(true)
            .open(log_dir.join("daemon.log"))
    {
        if let Ok(stderr) = stdout.try_clone() {
            command.stderr(Stdio::from(stderr));
        }
        command.stdout(Stdio::from(stdout));
    }

    command
        .spawn()
        .with_context(|| format!("Could not launch {} daemon", backend_exe.display()))?;
''',
              'backend log redirection',
          )

          text = text.replace(
              'set_title: "NVIDIA tuning first",\n                                        set_subtitle: "v1 exposes core V/F frequency offset, memory P-state offset, core/memory clock locks, voltage boost, power limit and live telemetry. Direct V/F voltage editing remains disabled because NVIDIA exposes those point voltages as immutable on this path.",',
              'set_title: "NVIDIA monitoring first",\n                                        set_subtitle: "This safety build exposes live telemetry and reads the driver-reported tuning ranges, but all GPU-changing actions are locked until automatic rollback/confirmation protection is implemented and validated.",',
          )
          path.write_text(text)

          # ------------------------------------------------------------------
          # Release/package messaging must match the fail-closed behavior.
          # ------------------------------------------------------------------
          path = Path('.github/workflows/windows-release.yml')
          text = path.read_text()
          text = text.replace('name: Windows NVIDIA tuning preview', 'name: Windows NVIDIA safe GUI preview')
          text = text.replace(
              'LACT Windows NVIDIA Tuning Preview',
              'LACT Windows NVIDIA Safe Preview',
          )
          text = text.replace(
              '''Windows v1 controls:
          - live NVIDIA telemetry through NVML
          - core clock offset through native NVIDIA NVAPI V/F points, with NVML fallback
          - memory clock offset across writable memory P-states
          - GPU minimum/maximum locked clocks
          - memory minimum/maximum locked clocks
          - NVAPI voltage boost when exposed by the driver
          - NVIDIA power limit
          - reset of clock offsets, V/F curve, locks and voltage boost

          If a driver write requires elevation, close LACT and run LACT-GUI.exe
          as Administrator.
''',
              '''Windows safe-preview behavior:
          - live NVIDIA telemetry through NVML
          - reads driver-reported clock/offset/power ranges for validation
          - GPU-changing controls are disabled in the GUI
          - the Windows daemon independently rejects hardware write requests
          - no power-limit, clock, voltage, fan, profile, detach or driver-state change is allowed

          Diagnostic logs:
          %LOCALAPPDATA%\\LACT\\logs\\bootstrap.log
          %LOCALAPPDATA%\\LACT\\logs\\gui.log
          %LOCALAPPDATA%\\LACT\\logs\\daemon.log

          Experimental writes are intentionally NOT enabled by LACT-GUI.exe.
''',
              'release README safety block',
          )
          text = text.replace(
              '--notes "Download LACT-Windows-NVIDIA-Tuning-Setup.exe. This build contains a dedicated windowed LACT-GUI.exe plus a separate lact.exe backend, fixing the previous Windows filename collision. v1 exposes NVIDIA telemetry, NVAPI core V/F clock offset, memory offset, GPU/memory clock locks, voltage boost, power limit and reset controls from the GUI."',
              '--notes "Download LACT-Windows-NVIDIA-Tuning-Setup.exe. This Windows safety preview opens a real GUI, starts a separate local backend, writes bootstrap/gui/daemon diagnostics under %LOCALAPPDATA%\\LACT\\logs, and is fail-closed: telemetry works but all GPU-changing clock, voltage, fan, power, profile and driver-state writes are blocked in both the GUI and daemon until rollback protection is validated."',
          )
          path.write_text(text)
          PY

          cargo fmt --all

          grep -q 'WINDOWS_SAFE_MODE: bool = true' lact-gui/src/windows_app.rs
          grep -q 'I_UNDERSTAND_THIS_IS_EXPERIMENTAL' lact-daemon/src/windows.rs
          grep -q 'Safe Read-Only Mode' lact-daemon/src/windows.rs
          grep -q 'daemon.log' lact-gui/src/windows_app.rs

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "Benjamin Steiner"
          git config user.email "60236447+Benjamin-Steiner@users.noreply.github.com"
          git add lact-daemon/src/windows.rs lact-gui/src/windows_app.rs .github/workflows/windows-release.yml
          if git diff --cached --quiet; then
            echo "No hardening changes to commit."
            exit 0
          fi
          git commit -m "safety(windows): fail closed and persist diagnostics"
          git push origin HEAD:windows/platform-foundation-20260821
